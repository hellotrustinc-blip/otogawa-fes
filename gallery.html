<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>投稿動画を見る｜大戸川祭礼</title>
<meta name="description" content="大戸川祭礼に投稿された動画を閲覧できます。">
<style>
  :root{
    --ink:#1a1410;
    --paper:#f7f1e6;
    --paper2:#efe6d4;
    --red:#b23a2e;
    --red-d:#8f2c22;
    --gold:#c99a2e;
    --shadow:0 8px 30px rgba(26,20,16,.12);
    --maxw:1080px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:"Hiragino Mincho ProN","Yu Mincho",serif;
    color:var(--ink);
    background:var(--paper);
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  .sans{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  .wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 16px}
  header{position:sticky;top:0;z-index:20;background:rgba(247,241,230,.94);backdrop-filter:blur(6px);border-bottom:1px solid rgba(26,20,16,.08)}
  nav{min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .brand{font-weight:700;letter-spacing:.12em;color:var(--red-d);text-decoration:none}
  .home{color:var(--ink);text-decoration:none;font-size:.9rem;text-align:right}
  .hero{padding:48px 0 28px;background:linear-gradient(160deg,#8f2c22,#6b2019)}
  .hero h1{color:#fff;font-size:clamp(2rem,9vw,3.8rem);line-height:1.25;letter-spacing:.08em;text-shadow:0 4px 18px rgba(0,0,0,.25)}
  .hero p{margin-top:14px;color:#f7f1e6;font-size:1rem}
  main{padding:32px 0 64px}
  .gallery-head{display:flex;justify-content:space-between;gap:12px;align-items:end;margin-bottom:18px;min-width:0}
  h2{font-size:1.35rem;letter-spacing:.08em;color:var(--red-d)}
  .sub-link{color:var(--red-d);font-weight:700;text-decoration:none;white-space:nowrap}
  .sub-link:hover{text-decoration:underline}
  .gallery-grid{display:grid;gap:14px;grid-template-columns:minmax(0,1fr)}
  @media(min-width:420px){.gallery-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
  @media(min-width:760px){.gallery-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
  .video-card{border:0;background:#fff;border-radius:8px;overflow:hidden;text-align:left;box-shadow:var(--shadow);cursor:pointer;color:var(--ink)}
  .video-card img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;background:var(--paper2)}
  .video-title,.video-date{display:block;padding:0 10px;overflow-wrap:anywhere}
  .video-title{padding-top:10px;font-weight:700;line-height:1.45}
  .video-date{padding-bottom:10px;color:#6d625a;font-size:.78rem;font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif}
  .muted{color:#6d625a}
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:50;display:grid;place-items:center;padding:18px}
  .modal[hidden]{display:none}
  .modal-inner{width:min(960px,100%);background:#000;border-radius:8px;overflow:hidden;position:relative}
  .modal-close{position:absolute;right:8px;top:8px;z-index:2;width:40px;height:40px;border:0;border-radius:50%;background:rgba(255,255,255,.9);font-size:1.5rem;cursor:pointer}
  iframe{display:block;width:100%;aspect-ratio:16/9;border:0}
</style>
<script>
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbze0fQizkV9H40tu0_XSmC4DM5MuD_2PZDsKxgZcjwprYpCK2SESj3jKcP0-h1khO_F/exec';
  window.GAS_URL = GAS_URL;
</script>
</head>
<body>
<header>
  <nav class="wrap">
    <a class="brand" href="index.html">大戸川祭礼</a>
    <a class="home sans" href="index.html">祭礼サイトへ戻る</a>
  </nav>
</header>
<section class="hero">
  <div class="wrap">
    <h1>投稿動画を見る</h1>
    <p class="sans">祭礼の動画を新しい順に掲載しています。</p>
  </div>
</section>
<main class="wrap">
  <div class="gallery-head">
    <div>
      <h2>投稿動画</h2>
      <p class="muted sans">新しい順</p>
    </div>
    <a class="sub-link sans" href="douga.html">動画を投稿する →</a>
  </div>
  <!-- 検収用: gallery.html?mock=1 でGAS未接続のモック表示 -->
  <div id="gallery" class="gallery-grid" aria-live="polite"></div>
</main>
<div id="video-modal" class="modal" hidden>
  <div class="modal-inner">
    <button id="modal-close" class="modal-close" type="button" aria-label="閉じる">×</button>
    <iframe id="video-frame" src="about:blank" allowfullscreen></iframe>
  </div>
</div>
<script type="module" src="./douga.js"></script>
</body>
</html>
