<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>PENDING</title>
<style>iframe{width:390px;height:700px;border:0}</style></head>
<body>
<iframe id="f" src="../game.html"></iframe>
<pre id="result">PENDING</pre>
<script>
  // むずかしいモードの機械証明3点: ①過補正（θ小で正しい側タップ→反対符号へ）
  // ②鳥イベント（forceBird→θが鳥側へ・getState().bird可視） ③落下時「しっかりしろよー」
  const out = (o) => {
    document.getElementById('result').textContent = 'E2E_RESULT:' + JSON.stringify(o);
    document.title = 'E2E_DONE';
  };
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const w = f.contentWindow;
        const doc = f.contentDocument;
        const dbg = w.__omikoshiDebug;
        const r = {};
        dbg.start('hard');
        r.mode = dbg.getState().mode;
        // ① 過補正: |θ|が(0.005, 0.049)の窓に入るのを待って正しい側を同期タップ
        const waitWindow = (cb, tries = 0) => {
          const th = dbg.getState().theta;
          const a = Math.abs(th);
          if ((a > 0.005 && a < 0.049) || tries > 300) cb(th, tries > 300);
          else setTimeout(() => waitWindow(cb, tries + 1), 50);
        };
        waitWindow((th0, timedOut) => {
          r.overshootWindowTimeout = timedOut;
          r.overshootThetaBefore = th0;
          if (th0 < 0) dbg.tapLeft(); else dbg.tapRight();
          const th1 = dbg.getState().theta;
          r.overshootThetaAfter = th1;
          r.overshootFlipped = (th0 > 0) !== (th1 > 0) && th1 !== 0;
          // ②③ 落下を待ち、落下直後（θ=0リセット）に鳥を乗せて引っ張りを測りつつ、
          // 同じ落下の「しっかりしろよー」（落下620ms後〜約1.8秒表示）を920ms時点で確認
          const drops0 = dbg.getState().drops;
          const waitDrop = (tries = 0) => {
            const s = dbg.getState();
            if (s.drops > drops0) {
              dbg.forceBird('left');
              r.birdState = dbg.getState().bird;
              const thB0 = dbg.getState().theta;
              setTimeout(() => {
                const thB1 = dbg.getState().theta;
                r.birdThetaBefore = thB0;
                r.birdThetaAfter = thB1;
                r.birdPullsLeft = thB1 < thB0 - 0.01;
                const text = doc.body.innerText.replace(/\s+/g, ' ');
                r.crowdVoiceFound = text.includes('しっかりしろよー');
                r.dropsSeen = dbg.getState().drops;
                out(r);
              }, 920);
            } else if (tries > 240) {
              r.dropTimeout = true;
              out(r);
            } else setTimeout(() => waitDrop(tries + 1), 50);
          };
          waitDrop();
        });
      } catch (e) { out({ error: String(e) }); }
    }, 1500);
  });
</script>
</body>
</html>
