<!DOCTYPE html>
<html lang="ja">
<head><meta charset="utf-8"><title>PENDING</title>
<style>iframe{width:390px;height:700px;border:0}</style></head>
<body>
<iframe id="f" src="../game.html"></iframe>
<pre id="result">PENDING</pre>
<script>
  const out = (o) => {
    document.getElementById('result').textContent = 'E2E_RESULT:' + JSON.stringify(o);
    document.title = 'E2E_DONE';
  };
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const dbg = f.contentWindow.__omikoshiDebug;
        dbg.start();
        const t0 = performance.now();
        const timer = setInterval(() => {
          const s = dbg.getState();
          const sec = (performance.now() - t0) / 1000;
          if (s.finished || sec > 200) {
            clearInterval(timer);
            out({ finished: s.finished, elapsedSec: Number(sec.toFixed(1)), drops: s.drops, progress: Number(s.progress.toFixed(3)) });
          }
        }, 500);
      } catch (e) { out({ error: String(e) }); }
    }, 1500);
  });
</script>
</body>
</html>
