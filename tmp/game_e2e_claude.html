<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PENDING</title>
<style>
  body { margin: 0; padding: 10px; background: #ddd; }
  iframe { width: 390px; height: 700px; border: 0; display: block; }
  pre { font-size: 12px; }
</style>
</head>
<body>
<iframe id="f" src="../game.html"></iframe>
<pre id="result">PENDING</pre>
<script>
  const out = (obj) => {
    const s = JSON.stringify(obj);
    document.getElementById('result').textContent = 'E2E_RESULT:' + s;
    document.title = 'E2E_DONE';
  };
  const f = document.getElementById('f');
  f.addEventListener('load', () => {
    setTimeout(() => {
      try {
        const w = f.contentWindow;
        const doc = f.contentDocument;
        const dbg = w.__omikoshiDebug;
        const r = {};
        r.iframeWidth = f.getBoundingClientRect().width;
        const canvas = doc.querySelector('canvas');
        r.hasCanvas = !!canvas;
        const ctx = canvas.getContext('2d');
        const img = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
        let nonBg = 0;
        const r0 = img[0], g0 = img[1], b0 = img[2];
        for (let i = 0; i < img.length; i += 4) {
          if (img[i] !== r0 || img[i + 1] !== g0 || img[i + 2] !== b0) nonBg++;
        }
        r.nonBgPixels = nonBg;
        // 同期タップ補正量の実測（フレーム間ドリフト混入なし）
        const t0 = dbg.getState().theta;
        dbg.tapLeft();
        const t1 = dbg.getState().theta;
        r.dbgTapDelta = t1 - t0;
        // 実イベント経路: canvas上へ実PointerEvent(右側)を発火し同期でθ変化を見る
        const rect = canvas.getBoundingClientRect();
        const t2 = dbg.getState().theta;
        const ev = new w.PointerEvent('pointerdown', {
          clientX: rect.left + rect.width - 15,
          clientY: rect.top + rect.height / 2,
          bubbles: true, cancelable: true, pointerId: 1
        });
        canvas.dispatchEvent(ev);
        const t3 = dbg.getState().theta;
        r.realTapDelta = t3 - t2;
        r.progress = dbg.getState().progress;
        // ゴール演出
        dbg.forceGoal();
        setTimeout(() => {
          const text = doc.body.innerText.replace(/\s+/g, ' ');
          r.finishTextFound = text.includes('奉納完了');
          r.retryFound = text.includes('もう一回');
          r.finished = dbg.getState().finished;
          out(r);
        }, 300);
      } catch (e) {
        out({ error: String(e) });
      }
    }, 1500);
  });
</script>
</body>
</html>
