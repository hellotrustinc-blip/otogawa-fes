<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PENDING</title>
<style>
  body { margin: 0; padding: 10px; background: #ddd; font-family: sans-serif; }
  iframe { width: 390px; height: 700px; border: 0; display: block; }
  pre { font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="gameFrame" src="../game.html"></iframe>
<pre id="result">PENDING</pre>
<script>
  const frame = document.getElementById('gameFrame');
  const result = document.getElementById('result');

  function finish(payload) {
    result.textContent = 'E2E_RESULT:' + JSON.stringify(payload);
    document.title = 'E2E_DONE';
  }

  function makeList() {
    return Array.from({ length: 100 }, (_, index) => ({
      rank: index + 1,
      name: `ななし${String(index + 1).padStart(3, '0')}`,
      timeSec: 45 + index / 10,
      drops: index % 4
    }));
  }

  frame.addEventListener('load', async () => {
    try {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;
      const fetchCalls = [];
      win.fetch = async (url, options = {}) => {
        fetchCalls.push({ url: String(url), options });
        if (options.method === 'POST') return { json: async () => ({ ok: true, rank: 7 }) };
        return { json: async () => ({ ok: true, list: makeList() }) };
      };

      win.__omikoshiDebug.forceGoal();
      doc.getElementById('scoreName').value = 'てすと';
      doc.getElementById('scoreSubmit').click();
      await waitFor(() => doc.getElementById('rankMessage').textContent.includes('あなたは7位'), 2000);
      const registered = doc.getElementById('rankMessage').textContent.includes('あなたは7位');

      await waitFor(() => doc.querySelectorAll('.rank-row').length === 100, 2000);
      const panel = doc.querySelector('.rank-panel');
      const listed100 = doc.querySelectorAll('.rank-row').length === 100;
      const widthOk = panel.scrollWidth <= 390;

      win.fetch = async () => {
        throw new Error('mock failure');
      };
      doc.getElementById('rankHard').click();
      await waitFor(() => doc.getElementById('rankList').textContent.includes('ランキングはじゅんびちゅう'), 2000);
      const failureReady = doc.getElementById('rankList').textContent.includes('ランキングはじゅんびちゅう');

      finish({
        registered,
        listed100,
        widthOk,
        failureReady,
        fetchCalls: fetchCalls.length,
        scrollWidth: panel.scrollWidth
      });
    } catch (error) {
      finish({ registered: false, listed100: false, widthOk: false, failureReady: false, error: String(error) });
    }
  });

  function waitFor(check, timeoutMs) {
    const started = performance.now();
    return new Promise((resolve, reject) => {
      const timer = setInterval(() => {
        if (check()) {
          clearInterval(timer);
          resolve();
          return;
        }
        if (performance.now() - started > timeoutMs) {
          clearInterval(timer);
          reject(new Error('timeout'));
        }
      }, 20);
    });
  }
</script>
</body>
</html>
