<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>PENDING</title>
<style>
  body { margin: 0; padding: 10px; background: #ddd; font-family: sans-serif; }
  iframe { width: 390px; height: 700px; border: 0; display: block; }
  pre { font-size: 12px; white-space: pre-wrap; }
</style>
</head>
<body>
<iframe id="gameFrame" src="../game.html"></iframe>
<pre id="result">PENDING</pre>
<script>
  const frame = document.getElementById('gameFrame');
  const result = document.getElementById('result');

  function finish(payload) {
    result.textContent = 'E2E_RESULT:' + JSON.stringify(payload);
    document.title = 'E2E_DONE';
  }

  frame.addEventListener('load', () => {
    const startedAt = performance.now();
    const params = new URLSearchParams(location.search);
    const intervalMs = Number(params.get('interval') || 100);
    const mode = params.get('mode') === 'hard' ? 'hard' : 'easy';
    let ticks = 0;
    let timer = 0;
    let reachedOsame = false;
    try {
      const debug = frame.contentWindow.__omikoshiDebug;
      if (!debug || typeof debug.start !== 'function' || typeof debug.mash !== 'function') {
        finish({ finished: false, elapsedSec: 0, drops: 0, error: 'debug start() not found' });
        return;
      }
      const doc = frame.contentDocument;
      const overlay = doc.getElementById('startOverlay');
      const overlayText = overlay ? overlay.innerText.replace(/\s+/g, ' ') : '';
      const overlayVisible = !!overlay && !overlay.hidden;
      if (!overlayVisible || !overlayText.includes('八坂神社') || !overlayText.includes('下がった側') || !overlayText.includes('ゲームオーバー') || !overlayText.includes('モード')) {
        finish({ finished: false, elapsedSec: 0, drops: 0, error: 'start overlay text not visible' });
        return;
      }
      const initialProgress = debug.getState().progress;
      debug.start(mode);
      if (!overlay.hidden) {
        finish({ finished: false, elapsedSec: 0, drops: 0, error: 'start overlay did not hide' });
        return;
      }
      timer = setInterval(() => {
        try {
          const state = debug.getState();
          ticks += 1;
          if (state.phase === 'osame') reachedOsame = true;
          if (ticks === 8 && state.progress <= initialProgress) {
            clearInterval(timer);
            finish({ finished: false, elapsedSec: 0, drops: state.drops, error: 'game did not start moving' });
            return;
          }
          if (state.finished) {
            clearInterval(timer);
            finish({
              finished: true,
              elapsedSec: Number(((performance.now() - startedAt) / 1000).toFixed(1)),
              drops: state.drops,
              intervalMs,
              mode,
              reachedOsame,
              phase: state.phase
            });
            return;
          }
          if (ticks >= 1150) {
            clearInterval(timer);
            finish({
              finished: false,
              elapsedSec: Number(((performance.now() - startedAt) / 1000).toFixed(1)),
              drops: state.drops,
              intervalMs,
              mode,
              reachedOsame,
              phase: state.phase,
              osame: state.osame
            });
            return;
          }
          if (state.phase === 'osame') {
            debug.mash();
            return;
          }
          if (mode === 'hard' && Math.abs(state.theta) <= 0.06) return;
          if (state.theta < 0) {
            debug.tapLeft();
          } else {
            debug.tapRight();
          }
        } catch (error) {
          clearInterval(timer);
          finish({ finished: false, elapsedSec: 0, drops: 0, error: String(error) });
        }
      }, intervalMs);
    } catch (error) {
      clearInterval(timer);
      finish({ finished: false, elapsedSec: 0, drops: 0, error: String(error) });
    }
  });
</script>
</body>
</html>
